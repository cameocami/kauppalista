<!DOCTYPE html>
<html>

<head>
  <title>Uusi tuote</title>
</head>

<body>
  
  {% if session.username %}
  <p>
    Olet kirjautunut nimellä {{ session.username }}, id-numerosi {{ session.user_id}}
  </p>
  {% endif %}
  <p>

  <h1>Uusi tuote</h1>
  <form action="/create_product" method="post">
    <p>
      Tuotteen nimi: <br />
      <input type="text" name="name" maxlength="50" required/>
    </p>
    <p>
      Hinta: <br />
      <input type="text" name="price" size="5" value="0,00" pattern="^\d+(,\d{0,2})?$" required/> €
    </p>
    <input type="submit" value="Luo tuote" />
  </form>

 
</body>

</html>
