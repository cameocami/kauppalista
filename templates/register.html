{% extends "layout.html" %}

{% block title %}Luo tunnus{% endblock %}

{% block content %}

  <form action="/create_user" method="post">
    <p>
      <label for="username">Tunnus:</label><br />
      <input type="text" name="username" id="username" maxlength="30" minlength="5" pattern="^[\w-]+" required />
    </p>
    <p>
      <label for="password1">Salasana:</label><br />
      <input type="password" name="password1" id="password1" minlength="8" required/>
    </p>
    <p>
      <label for="password2">Salasana uudestaan:</label><br />
      <input type="password" name="password2" id="password2" minlength="8" required/>
    </p>
    <input type="submit" value="Luo tunnus" />
  </form>
{% endblock %}
