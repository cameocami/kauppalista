<!DOCTYPE html>
<html>

<head>
  <title>{{product.name}}</title>
</head>

<body>

    {% if session.user_id == product.user_id%}
  <p>
    <a href="/edit_product/{{ product.id }}">Muokkaa tuotetta</a>
    <a href="/remove_product/{{ product.id }}">Poista tuote</a>
  </p>
  {% endif %}
  <p>

  <h1>{{product.name}}</h1>
  <form action="/add_item/{{ product.id }}" method="post">
    <p>
  Lisää omaan kauppalistaan <input type="text" name="amount" size="5" required/>  {{product.unit}}
  <input type="submit" name="submit" value="+" /> </p>
  </form>
<p>
    Hinta: {{product.price}} € / {{product.unit}}
  </p>
  <p>
    Osasto: {{product.department}}
  </p>
   <p>
    Luonut: <a href="/user/{{product.user_id}}"> {{product.username}} </a>
  </p>

  <p>
    <a href="/">Takaisin</a>
  </p>
</body>

</html>
