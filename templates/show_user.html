<!DOCTYPE html>
<html>

<head>
  <title>{{user.username}}:n kauppalista</title>
</head>

<body>

  <h1>Käyttäjän {{user.username}} kauppalista</h1>
  <p>yhteensä {{ shopping_list | count }} tuotetta:</p>
    <ul>
    {% for item in shopping_list %}
    <li><a href="/product/{{item.id}}">{{item.name}}</a>,  {{item.amount}}  {{item.unit_display_name}}</li>
    {% endfor %}
  </ul>
    <a href="/">Takaisin</a>
  </p>
</body>

</html>
