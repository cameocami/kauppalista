{% extends "layout.html" %}

{% block title %}Tuotteen muokkaus{% endblock %}

{% block content %}
  <form action="/update_product" method="post">
    <p>
      <label for="name">Tuotteen nimi:</label><br />
      <input type="text" name="name" id="name" value="{{product.name}}" maxlength="50" required/>
    </p>
    <p>
      <label for="price">Hinta:</label><br />
      <input type="text" name="price" id="price" size="5" value="{{product.price}}" pattern="(0|[1-9]\d*)([,\.]\d{1,2})?" required/> € /
      <select name="unit" id="unit">
        {% for unit in units %}
          {% if unit.display_name == product.unit%}
          <option value="{{unit.name}}" selected >{{unit.display_name}}</option>
          {% else %}
          <option value="{{unit.name}}">{{unit.display_name}}</option>
        {% endif %}
        {% endfor %}
      </select>
    </p>
    <p><label for="department">Osasto:</label><select name="department" id="department">
      {% for department in departments %}
        {% if department.display_name == product.department%}
        <option value="{{department.name}}" selected >{{department.display_name}}</option>
        {% else %}
        <option value="{{department.name}}">{{department.display_name}}</option>
        {% endif %}
      {% endfor %}
    </select>
    </p>

    <p>
    <label for="rating">Oma arvio:</label><select name="rating" id="rating">
    {% if not product.user_rating %}
    <option value="" selected >(valitse)</option>
    {% endif %}
    {% for number in range(1,6) %}
    {% if product.user_rating == number %}
    <option value="{{number}}" selected >{{number}}</option>
    {% else %}
    <option value="{{number}}" >{{number}}</option>
    {% endif %}
    {% endfor %}
    </select>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="hidden" name="product_id" value="{{ product.id }}" />
    <input type="submit" value="Päivitä" />
  </form>
{% endblock %}
