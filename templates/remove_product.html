{% extends "layout.html" %}

{% block title %}Tuotteen {{product.name}} poisto{% endblock %}

{% block content %}

<p>Haluatko varmasti poistaa tämän tuotteen?</p>
<form action="/remove_product/{{product.id}}" method="post">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" name="remove" value="Poista tuote">
    <input type="submit" name="back" value="Takaisin">
</form>       
{% endblock %}
